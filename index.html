
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doguinho da Sorte</title>

    <meta name="description" content="Acesse o Doguinho da Sorte.">
    <meta name="theme-color" content="#5B1263">

    <!-- ÍCONES PERSONALIZADOS -->
    <link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">

    <!-- CONFIGURAÇÃO PWA -->
    <link rel="manifest" href="./manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Doguinho">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080808;
            font-family: Arial, sans-serif;
        }

        /* SITE */

        .container {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: #080808;
        }

        /* AVISO DE INSTALAÇÃO */

        #installBanner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999999;

            background: #5B1263;
            color: #fff;

            padding: 12px 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            box-shadow: 0 3px 12px rgba(0,0,0,.4);
        }

        .install-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .install-info img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
        }

        .install-text strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .install-text span {
            display: block;
            font-size: 11px;
            color: #eee;
        }

        .install-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        #installButton {
            background: #FFD32A;
            color: #42104B;

            border: none;
            padding: 11px 15px;

            border-radius: 7px;

            font-weight: bold;
            font-size: 13px;

            cursor: pointer;
        }

        #closeInstall {
            background: transparent;
            border: none;
            color: white;

            font-size: 25px;
            padding: 4px;

            cursor: pointer;
        }

        [hidden] {
            display: none !important;
        }

        @media (max-width: 380px) {

            #installBanner {
                padding: 9px;
            }

            .install-info img {
                width: 40px;
                height: 40px;
            }

            .install-text strong {
                font-size: 12px;
            }

            .install-text span {
                font-size: 10px;
            }

            #installButton {
                padding: 9px 10px;
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

    <!-- FAIXA DE INSTALAÇÃO -->

    <div id="installBanner" hidden>

        <div class="install-info">

            <img
                src="./icons/icon-192.png"
                alt="Doguinho da Sorte">

            <div class="install-text">

                <strong>Doguinho da Sorte</strong>

                <span>
                    Instale nosso aplicativo no seu celular!
                </span>

            </div>

        </div>

        <div class="install-actions">

            <button id="installButton">
                INSTALAR
            </button>

            <button id="closeInstall" aria-label="Fechar">
                &times;
            </button>

        </div>

    </div>


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="container">

        <iframe
            src="https://doguinhodasorte.com/pr/GUZztR7J"
            title="Doguinho da Sorte"

            allow="
                autoplay;
                clipboard-read;
                clipboard-write;
                fullscreen;
                geolocation;
                microphone;
                camera;
                payment;
                publickey-credentials-get;
                screen-wake-lock;
                web-share
            "

            allowfullscreen

            sandbox="
                allow-forms
                allow-scripts
                allow-same-origin
                allow-popups
                allow-popups-to-escape-sandbox
                allow-downloads
                allow-modals
                allow-pointer-lock
                allow-presentation
                allow-top-navigation-by-user-activation
            "

            loading="eager">

        </iframe>

    </main>


    <!-- SISTEMA PWA -->

    <script>

        const banner =
            document.getElementById("installBanner");

        const installButton =
            document.getElementById("installButton");

        const closeButton =
            document.getElementById("closeInstall");

        let deferredPrompt = null;

        const isInstalled =
            window.matchMedia(
                "(display-mode: standalone)"
            ).matches ||
            window.navigator.standalone === true;


        // MOSTRAR AVISO

        if (
            !isInstalled &&
            localStorage.getItem("installDismissed") !== "true"
        ) {
            banner.hidden = false;
        }


        // DETECTAR INSTALAÇÃO DISPONÍVEL

        window.addEventListener(
            "beforeinstallprompt",
            (event) => {

                event.preventDefault();

                deferredPrompt = event;

                if (
                    !isInstalled &&
                    localStorage.getItem("installDismissed") !== "true"
                ) {
                    banner.hidden = false;
                }

            }
        );


        // INSTALAR APLICATIVO

        installButton.addEventListener(
            "click",
            async () => {

                if (deferredPrompt) {

                    deferredPrompt.prompt();

                    const result =
                        await deferredPrompt.userChoice;

                    if (result.outcome === "accepted") {

                        banner.hidden = true;

                    }

                    deferredPrompt = null;

                } else {

                    alert(
                        "Para instalar o Doguinho da Sorte:\n\n" +

                        "ANDROID:\n" +
                        "Abra os três pontinhos do Chrome e escolha " +
                        "'Instalar aplicativo' ou 'Adicionar à tela inicial'.\n\n" +

                        "IPHONE:\n" +
                        "Toque em Compartilhar e depois em " +
                        "'Adicionar à Tela de Início'."
                    );

                }

            }
        );


        // FECHAR AVISO

        closeButton.addEventListener(
            "click",
            () => {

                banner.hidden = true;

                localStorage.setItem(
                    "installDismissed",
                    "true"
                );

            }
        );


        // INSTALAÇÃO CONCLUÍDA

        window.addEventListener(
            "appinstalled",
            () => {

                banner.hidden = true;

                deferredPrompt = null;

            }
        );


        // SERVICE WORKER

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register("./sw.js")
                        .catch(error => {

                            console.log(
                                "Erro ao registrar PWA:",
                                error
                            );

                        });

                }
            );

        }

    </script>

</body>
</html>
